<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="utf-8">
  <title>Test</title>
</head>
<body style="background:#ffffff; color:#000000; font-family:sans-serif; padding:20px;">
  <pre id="out"></pre>
  <script>
    if ("geolocation" in navigator) {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          document.getElementById("out").textContent =
            "Latitude: " + pos.coords.latitude + "\nLongitude: " + pos.coords.longitude;
        },
        (err) => {
          document.getElementById("out").textContent = "Gabim ose leja u refuzua: " + err.message;
        }
      );
    } else {
      document.getElementById("out").textContent = "Shfletuesi nuk e mbështet lokacionin.";
    }
  </script>
</body>
</html>
